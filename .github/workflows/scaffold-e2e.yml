# End-to-end check that this skill can scaffold a working project.
#
# Renders `scripts/scaffold.py` into a temp directory, asserts no
# unresolved `{{ }}` placeholders escaped, then runs ruff and pytest
# inside the rendered project. Catches:
#   * placeholder drift (template adds {{ key }}, scaffold.py doesn't render it)
#   * lint regressions (template change makes ruff unhappy)
#   * test regressions (template change breaks pytest)
#   * import-path drift (template renames a module, scaffold.py copies a broken import)
#
# Triggers:
#   * push to main / PRs against main / manual dispatch — covers skill-side changes
#   * repository_dispatch (type: template-updated) — fired by the template repo
#     on its own changes so we catch drift the other direction
#
# Optional input `template_ref` lets a manual run pin a different template
# version (tag, branch, or SHA) than the scaffold.py default — useful for
# pre-release rehearsal.

name: scaffold-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      template_ref:
        description: "Template ref (tag/branch/SHA) to scaffold against. Leave blank for scaffold.py default."
        required: false
        default: ""
  repository_dispatch:
    types: [template-updated]

jobs:
  scaffold-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # No cache: setup-uv@v3 errors when its cache-dependency-glob
          # (default `**/uv.lock`) matches nothing, and the lock file only
          # exists inside the *scaffolded* project, which doesn't exist
          # yet at this step. Re-enable once the rendered project lives
          # at a predictable path that's known to contain a uv.lock.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Determine template ref
        id: ref
        run: |
          # Three sources, in precedence order: manual input > dispatch payload > default
          REF="${{ github.event.inputs.template_ref }}"
          if [ -z "$REF" ]; then
            REF="${{ github.event.client_payload.ref }}"
          fi
          if [ -n "$REF" ]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "Using template ref: $REF"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "Using scaffold.py default template ref"
          fi

      - name: Scaffold a test project
        run: |
          ARGS=(
            --dest /tmp/e2e-project
            --name e2e-test-project
            --description "End-to-end CI scaffold smoke test"
            --author "CI <ci@example.org>"
            --owner ci-bot
          )
          if [ -n "${{ steps.ref.outputs.ref }}" ]; then
            ARGS+=(--template-version "${{ steps.ref.outputs.ref }}")
          fi
          python scripts/scaffold.py "${ARGS[@]}"

      - name: Assert no unresolved placeholders
        run: |
          if grep -rE '\{\{ *[a-z_]+ *\}\}' /tmp/e2e-project; then
            echo "::error::Unresolved {{ placeholder }} tokens in rendered output"
            exit 1
          fi
          echo "✓ All placeholders resolved"

      - name: Sync rendered project's dependencies
        working-directory: /tmp/e2e-project
        run: uv sync --extra publish

      - name: Lint rendered project
        working-directory: /tmp/e2e-project
        run: |
          uv run ruff check scripts tests
          uv run ruff format --check scripts tests

      - name: Test rendered project
        working-directory: /tmp/e2e-project
        run: uv run pytest -q

      - name: CLI sanity-check on rendered project
        working-directory: /tmp/e2e-project
        run: |
          uv run python -m scripts.pipeline --help
          uv run python -m scripts.publish --help
