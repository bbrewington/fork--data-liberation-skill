# Fires a repository_dispatch event on the template repo whenever this
# skill changes in a way that could affect what the template renders to.
#
# The template repo's own scaffold-e2e workflow listens for the `skill-updated`
# event type and re-runs its E2E with this skill's HEAD scaffold.py — catching
# the case where a scaffold.py change makes the template un-renderable.
#
# Requires a repo secret `DISPATCH_TOKEN` — a personal access token with
# `contents: read` + `actions: write` scope on the template repo. See
# RELEASING.md for setup instructions.

name: dispatch-to-template

on:
  push:
    branches: [main]
    paths:
      # Skill changes that could affect what scaffolding produces:
      - "scripts/scaffold.py"
      # References describe the conventions the template implements;
      # references changing means the template should re-validate too.
      - "references/project-template.md"
      - "references/data-modeling.md"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    # Skip on forks — they don't have DISPATCH_TOKEN configured.
    if: github.repository == 'brianckeegan/data-liberation-skill'
    steps:
      - name: Dispatch skill-updated event to template repo
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::DISPATCH_TOKEN secret is not set; skipping dispatch. See RELEASING.md."
            exit 0
          fi
          curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/brianckeegan/data-liberation-template/dispatches \
            -d "$(cat <<EOF
          {
            "event_type": "skill-updated",
            "client_payload": {
              "skill_ref": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "reason": "push to data-liberation-skill main"
            }
          }
          EOF
          )"
          echo "✓ Dispatched skill-updated to data-liberation-template"
