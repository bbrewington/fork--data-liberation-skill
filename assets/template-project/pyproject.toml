[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "{{ description }}"
authors = [{name = "{{ author }}"}]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pandera[pandas]>=0.20",
    "pydantic>=2.6",
    "pyyaml>=6",
    "requests>=2.31",
    "requests-cache>=1.2",
    "tenacity>=8",
    "structlog>=24",
    "tabulate>=0.9",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11",
    "pypdf>=4",
    "camelot-py[cv]>=0.11",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
]
scrape = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.45",
]
tabular = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyreadstat>=1.2",
]
# Publish stack — Datasette ecosystem for the queryable data interface.
# `datasette-publish-vercel` is the default deploy provider; swap for
# `datasette-publish-fly` or rely on `datasette publish cloudrun` (built-in)
# if your project uses a different target.
publish = [
    "datasette>=0.65",
    "sqlite-utils>=3.36",
    "datasette-publish-vercel>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-recording>=0.13",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
{{ project_slug }} = "scripts.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
